name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm format:check
      - run: node --test scripts/test-deploy.mjs scripts/test-configure-local-storage.mjs scripts/test-format.mjs scripts/test-cloudflare-tunnel.mjs
      - run: pnpm --filter @midden/web lint
      - run: pnpm build && pnpm test
      - run: node scripts/prepare-web-assets.mjs
      - run: pnpm --filter @midden/web exec wrangler deploy --dry-run
      - run: pnpm --filter @midden/web exec playwright install --with-deps chromium
      - run: pnpm --filter @midden/web test:e2e
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: go vet ./...
      - run: ./scripts/test-integration.sh
