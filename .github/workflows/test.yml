name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/setup@v3
        with:
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm format:check
      - run: node --test scripts/test-deploy.mjs scripts/test-configure-local-storage.mjs scripts/test-format.mjs scripts/test-cloudflare-tunnel.mjs
      - run: pnpm --filter @midden/web lint
      - run: pnpm build && pnpm test
      - run: pnpm --filter @midden/web exec playwright install --with-deps chromium
      - run: pnpm --filter @midden/web test:e2e
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: go vet ./...
      - run: ./scripts/test-integration.sh
