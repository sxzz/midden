name: test
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: node scripts/prepare-web-assets.ts
        env:
          MIDDEN_MEDIA_URL: https://media.example.com
          MIDDEN_WEB_HOSTNAME: web.example.com
      - run: pnpm --filter @midden/web exec wrangler deploy --dry-run
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm install --frozen-lockfile
      # The runner image ships Google Chrome and its system libraries, so no
      # browser download and no apt (`--with-deps`) step.
      - run: pnpm --filter @midden/web test:e2e
        env:
          PLAYWRIGHT_CHANNEL: chrome
  # Every push builds and starts the image, alongside the checks and browser
  # tests rather than after them, once per architecture, each natively on its
  # own runner (no QEMU). On main each build is pushed by digest, with no tag;
  # `manifest` then joins the digests into one `sha-<commit>` list straight
  # away, and `latest`, which deploys read, moves only in `publish`, once
  # everything passes. The amd64 entry is plain linux/amd64, so amd64/v3
  # hosts take it too.
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            pair: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            pair: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    concurrency:
      group: image-${{ matrix.pair }}-${{ github.ref }}
      cancel-in-progress: false
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/midden
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The Dockerfile takes Node's version from devEngines, like mise does.
      - name: Node version
        id: node
        run: |
          version=$(jq -er .devEngines.runtime.version package.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # No attestations: each digest must be a single image manifest to
          # join into the list.
          provenance: false
          sbom: false
          outputs: ${{ env.PUBLISH == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || 'type=docker,name=midden:test' }}
          build-args: |
            NODE_VERSION=${{ steps.node.outputs.version }}
            VCS_REF=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=midden-${{ matrix.pair }}
          cache-to: type=gha,mode=max,scope=midden-${{ matrix.pair }}
      - name: Start it and check health
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [ "$PUBLISH" = true ]; then
            run="$IMAGE@$DIGEST"
          else
            run=midden:test
          fi
          docker run -d --name midden -e SECRET_KEY=0123456789abcdef0123456789abcdef -p 8080:8080 "$run"
          for i in $(seq 30); do curl -fsS http://127.0.0.1:8080/healthz && exit 0; sleep 1; done
          docker logs midden
          exit 1
      - name: Keep the digest
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - name: Upload the digest
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
  # Join the per-architecture digests into one `sha-<commit>` manifest list.
  manifest:
    needs: [image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
    concurrency:
      group: manifest-${{ github.ref }}
      cancel-in-progress: false
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/midden
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          [ "$(ls | wc -l)" = 2 ]
          docker buildx imagetools create --tag "$IMAGE:sha-$GITHUB_SHA" $(printf "$IMAGE@sha256:%s " *)
      - run: docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA"
  # Point `latest` at the list built above; a manifest copy in the
  # registry, no rebuild.
  publish:
    needs: [checks, e2e, manifest]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/midden
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:sha-$GITHUB_SHA"
