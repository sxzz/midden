name: test
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      # Thumbnail tests call ffmpeg and ffprobe: mise installs a prebuilt
      # conda-forge build, cached between runs, instead of apt.
      - run: pnpm test
        env:
          FFMPEG: ffmpeg
      - run: node scripts/prepare-web-assets.ts
      - run: pnpm --filter @midden/web exec wrangler deploy --dry-run
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm install --frozen-lockfile
      # The runner image ships Google Chrome and its system libraries, so no
      # browser download and no apt (`--with-deps`) step.
      - run: pnpm --filter @midden/web test:e2e
        env:
          PLAYWRIGHT_CHANNEL: chrome
  # Every push builds and starts the image; main also publishes it for
  # amd64 and arm64 once the checks and browser tests pass.
  image:
    needs: [checks, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    concurrency:
      group: image-${{ github.ref }}
      cancel-in-progress: false
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/midden
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The Dockerfile takes Node's version from devEngines, like mise does.
      - name: Node version
        id: node
        run: |
          version=$(jq -er .devEngines.runtime.version package.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Tags
        id: tags
        run: |
          if [ "$PUBLISH" = true ]; then
            { echo 'tags<<EOF'; echo "$IMAGE:latest"; echo "$IMAGE:sha-$GITHUB_SHA"; echo EOF; } >> "$GITHUB_OUTPUT"
            echo "run=$IMAGE:sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "tags=midden:test" >> "$GITHUB_OUTPUT"
            echo "run=midden:test" >> "$GITHUB_OUTPUT"
          fi
      - if: env.PUBLISH == 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ env.PUBLISH == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.PUBLISH == 'true' }}
          load: ${{ env.PUBLISH != 'true' }}
          build-args: |
            NODE_VERSION=${{ steps.node.outputs.version }}
            VCS_REF=${{ github.sha }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=midden
          cache-to: type=gha,mode=max,scope=midden
      - name: Start it and check health
        env:
          RUN_IMAGE: ${{ steps.tags.outputs.run }}
        run: |
          docker run -d --name midden -e SECRET_KEY=0123456789abcdef0123456789abcdef -p 8080:8080 "$RUN_IMAGE"
          for i in $(seq 30); do curl -fsS http://127.0.0.1:8080/healthz && exit 0; sleep 1; done
          docker logs midden
          exit 1
