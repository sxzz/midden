name: test
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      # Thumbnail tests call ffmpeg and ffprobe. A prebuilt conda-forge build
      # through mise, cached between runs, instead of apt.
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          mise_toml: |
            [tools]
            ffmpeg = "9.1.0"
      - run: pnpm test
        env:
          FFMPEG: ffmpeg
      - run: node scripts/prepare-web-assets.ts
      - run: pnpm --filter @midden/web exec wrangler deploy --dry-run
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      # The runner image ships Google Chrome and its system libraries, so no
      # browser download and no apt (`--with-deps`) step.
      - run: pnpm --filter @midden/web test:e2e
        env:
          PLAYWRIGHT_CHANNEL: chrome
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the image without publishing it
        run: docker build -t midden:test .
      - name: Start it and check health
        run: |
          docker run -d --name midden -e SECRET_KEY=0123456789abcdef0123456789abcdef -p 8080:8080 midden:test
          for i in $(seq 30); do curl -fsS http://127.0.0.1:8080/healthz && exit 0; sleep 1; done
          docker logs midden
          exit 1
