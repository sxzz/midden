name: test
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: node scripts/prepare-web-assets.ts
        env:
          MIDDEN_MEDIA_URL: https://media.example.com
          MIDDEN_WEB_HOSTNAME: web.example.com
      - run: pnpm --filter @midden/web exec wrangler deploy --dry-run
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm install --frozen-lockfile
      # The runner image ships Google Chrome and its system libraries, so no
      # browser download and no apt (`--with-deps`) step.
      - run: pnpm --filter @midden/web test:e2e
        env:
          PLAYWRIGHT_CHANNEL: chrome
  # Every push builds and starts the image, alongside the checks and browser
  # tests rather than after them. On main it pushes `sha-<commit>` straight
  # away; `latest`, which deploys read, moves only in `publish`, once all
  # three pass. Production runs on an Apple-silicon Mac, so the image is
  # arm64 only, built natively on an arm64 runner.
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    concurrency:
      group: image-${{ github.ref }}
      cancel-in-progress: false
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/midden
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The Dockerfile takes Node's version from devEngines, like mise does.
      - name: Node version
        id: node
        run: |
          version=$(jq -er .devEngines.runtime.version package.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Tags
        id: tags
        run: |
          if [ "$PUBLISH" = true ]; then
            echo "tags=$IMAGE:sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "run=$IMAGE:sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "tags=midden:test" >> "$GITHUB_OUTPUT"
            echo "run=midden:test" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          load: ${{ env.PUBLISH != 'true' }}
          build-args: |
            NODE_VERSION=${{ steps.node.outputs.version }}
            VCS_REF=${{ github.sha }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=midden
          cache-to: type=gha,mode=max,scope=midden
      - name: Start it and check health
        env:
          RUN_IMAGE: ${{ steps.tags.outputs.run }}
        run: |
          docker run -d --name midden -e SECRET_KEY=0123456789abcdef0123456789abcdef -p 8080:8080 "$RUN_IMAGE"
          for i in $(seq 30); do curl -fsS http://127.0.0.1:8080/healthz && exit 0; sleep 1; done
          docker logs midden
          exit 1
  # Point `latest` at the image tested above; a manifest copy in the
  # registry, no rebuild.
  publish:
    needs: [checks, e2e, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/midden
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:sha-$GITHUB_SHA"
