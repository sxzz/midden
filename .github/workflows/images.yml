name: images
on:
  workflow_run:
    workflows: [test]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: images-main
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - image: midden-core
            dockerfile: Dockerfile
          - image: midden-adapter
            dockerfile: adapters/x/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Restore Go compiler cache
        if: matrix.image == 'midden-core'
        uses: actions/cache@v4
        id: go-build-cache
        with:
          path: .local/buildkit-go
          key: buildkit-go-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum', 'Dockerfile') }}-${{ steps.revision.outputs.sha }}
          restore-keys: |
            buildkit-go-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum', 'Dockerfile') }}-
      - name: Inject and persist BuildKit Go cache
        if: matrix.image == 'midden-core'
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3
        with:
          cache-map: '{".local/buildkit-go":"/root/.cache/go-build"}'
          scratch-dir: .local/cache-dance
          skip-extraction: ${{ steps.go-build-cache.outputs.cache-hit == 'true' }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VCS_REF=${{ steps.revision.outputs.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:sha-${{ steps.revision.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.revision.outputs.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
