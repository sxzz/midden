# The server runs as two processes of one image on the same data: `midden`
# serves HTTP (the API, media, the web app), runs the Telegram bot and takes
# Litestream's heartbeats; `midden-worker` runs the jobs and timers. The
# jobs' database work then never stalls a request.
x-midden: &midden
  image: ${MIDDEN_IMAGE:-ghcr.io/sxzz/midden:latest}
  restart: unless-stopped
  # A small init as PID 1 passes signals on; Node as PID 1 ignores a
  # SIGTERM that arrives before its handler is registered.
  init: true
  env_file: .env
  volumes:
    # SQLite database and media; back this directory up.
    - ${DATA_PATH:-./data}:/data
  # The container's log goes away when a deploy recreates it; the server
  # also keeps rotated logs in the data directory (logs/midden.log and
  # logs/worker.log).
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '5'

services:
  midden:
    <<: *midden
    environment:
      DATA_DIR: /data
      MIDDEN_ROLE: web
    ports:
      - 127.0.0.1:${PORT:-8080}:8080
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:8080/healthz]
      interval: 30s
      # A busy server can take several seconds to answer.
      timeout: 10s
      # Startup (migrations, the R2 token check) does not count against it.
      start_period: 2m

  midden-worker:
    <<: *midden
    environment:
      DATA_DIR: /data
      MIDDEN_ROLE: worker
    # The web process applies the migrations; the worker waits for them.
    depends_on:
      midden:
        condition: service_healthy
    healthcheck:
      # Its own health check, on loopback inside the container.
      test: [CMD, wget, -qO-, http://127.0.0.1:8082/healthz]
      interval: 30s
      timeout: 10s
      start_period: 2m
    # Stopping hands running jobs back to the queue; a download may take a
    # moment to notice.
    stop_grace_period: 30s

  # Continuous copy of the database to R2 (litestream.yml). Off unless .env
  # has COMPOSE_PROFILES=litestream; see docs/operations.md.
  litestream:
    image: litestream/litestream:0.5.18@sha256:513bff62a88fc0c86c73d27333c41c54c89fe890a7c32a551600adff9309b11b
    profiles: [litestream]
    restart: unless-stopped
    # midden's user: files Litestream creates next to the database (its
    # state, and the WAL when it opens the database first) stay writable.
    user: '1000:1000'
    command: [replicate]
    environment:
      LITESTREAM_ACCESS_KEY_ID: ${LITESTREAM_ACCESS_KEY_ID:-}
      LITESTREAM_SECRET_ACCESS_KEY: ${LITESTREAM_SECRET_ACCESS_KEY:-}
      LITESTREAM_BUCKET: ${LITESTREAM_BUCKET:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
    volumes:
      - ${DATA_PATH:-./data}:/data
      - ./litestream.yml:/etc/litestream.yml:ro
    # On stop Litestream uploads what it has not yet; it allows itself 30 s.
    stop_grace_period: 1m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'
