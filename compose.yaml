services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: monitor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - ./.local/postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d monitor"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    image: ${CORE_IMAGE:-ghcr.io/sxzz/midden-core:latest}
    entrypoint:
      ["/bin/sh", "-ec", "monitorctl migrate && monitorctl app-password"]
    environment:
      ADMIN_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/monitor?sslmode=disable
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
      ADAPTER_ADDRESS: adapter:9091
      ADAPTER_TOKEN: ${ADAPTER_TOKEN}
      ADAPTER_TLS_CA: /tls/adapter.crt
      CREDENTIAL_KEY: ${CREDENTIAL_KEY:-}
    volumes:
      - ./.local/adapter-tls:/tls:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
  tls-init:
    image: ${CORE_IMAGE:-ghcr.io/sxzz/midden-core:latest}
    user: "0:0"
    entrypoint: [monitorctl, tls-init, /tls]
    volumes:
      - ./.local/adapter-tls:/tls
    restart: "no"
  adapter:
    image: ${ADAPTER_IMAGE:-ghcr.io/sxzz/midden-adapter:latest}
    environment:
      ADAPTER_TOKEN: ${ADAPTER_TOKEN:?set ADAPTER_TOKEN}
      ADAPTER_TLS_CERT: /tls/adapter.crt
      ADAPTER_TLS_KEY: /tls/adapter.key
    volumes:
      - ./.local/adapter-tls:/tls:ro
    depends_on:
      tls-init:
        condition: service_completed_successfully
    restart: unless-stopped
  core:
    image: ${CORE_IMAGE:-ghcr.io/sxzz/midden-core:latest}
    environment:
      DATABASE_URL: postgres://monitor_app:${APP_DB_PASSWORD}@postgres:5432/monitor?sslmode=disable
      ADAPTER_TLS_CA: /tls/adapter.crt
      CREDENTIAL_KEY: ${CREDENTIAL_KEY:-}
      ADAPTER_ADDRESS: adapter:9091
      ADAPTER_TOKEN: ${ADAPTER_TOKEN}
      S3_ENDPOINT: ${S3_ENDPOINT:?set S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
      ADMIN_LISTEN: :9090
    volumes:
      - ./.local/adapter-tls:/tls:ro
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9090:9090"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
