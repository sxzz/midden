services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: monitor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d monitor"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    entrypoint:
      ["/bin/sh", "-ec", "monitorctl migrate && monitorctl app-password"]
    environment:
      ADMIN_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/monitor?sslmode=disable
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
  adapter:
    build: .
    entrypoint: [xadapter]
    environment:
      ADAPTER_TOKEN: ${ADAPTER_TOKEN:?set ADAPTER_TOKEN}
    restart: unless-stopped
  core:
    build: .
    environment:
      DATABASE_URL: postgres://monitor_app:${APP_DB_PASSWORD}@postgres:5432/monitor?sslmode=disable
      ADAPTER_ADDRESS: adapter:9091
      ADAPTER_TOKEN: ${ADAPTER_TOKEN}
      S3_ENDPOINT: ${S3_ENDPOINT:?set S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHANNEL_ID: ${TELEGRAM_CHANNEL_ID:-}
      ADMIN_LISTEN: :9090
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9090:9090"
    depends_on:
      migrate:
        condition: service_completed_successfully
      adapter:
        condition: service_started
    restart: unless-stopped
volumes:
  postgres-data:
