syntax = "proto3";

package adapter.v1;

option go_package = "monitor/api/adapter/v1;adapterv1";

service Adapter {
  // Describe is required; all other operations are opt-in per provider.
  rpc Describe(DescribeRequest) returns (DescribeResponse);
  rpc Fetch(FetchRequest) returns (FetchResponse);
  rpc CheckConnection(CheckConnectionRequest) returns (CheckConnectionResponse);
}

message DescribeRequest {}

enum Visibility {
  VISIBILITY_UNSPECIFIED = 0;
  VISIBILITY_PUBLIC = 1;
  VISIBILITY_PRIVATE = 2;
}

// Names are extensible. Unknown names/major versions are ignored by callers.
message Capability {
  string name = 1;
  uint32 major = 2;
  uint32 minor = 3;
}

message Provider {
  string id = 1;
  string authentication = 2;
  repeated Visibility visibilities = 3;
  repeated Capability capabilities = 4;
}

message DescribeResponse {
  // Strict major.minor. Minor revisions must remain backward compatible.
  string protocol_version = 1;
  string adapter_id = 2;
  string version = 3;
  repeated string hosts = 4;
  repeated Provider providers = 5;
}

message FetchRequest {
  string url = 1;
  string external_id = 2;
  string provider_id = 3;
  string connection_id = 4;
  string access_scope = 5;
  string request_id = 6;
  SessionCredential credential = 7;
}

message Resource {
  string url = 1;
  string kind = 2;
  // Immutable media identity including rendition, scoped by platform/provider/access.
  string immutable_key = 3;
  string alt_text = 4;
  bool sensitive = 5;
}

message FetchResponse {
  string external_id = 1;
  string text = 2;
  string text_kind = 3;
  repeated Resource resources = 4;
  repeated string warnings = 5;
  string provider_id = 6;
  string adapter_version = 7;
  string text_source = 8;
  bool incomplete = 9;
  Visibility visibility = 10;
}

// Execution-only secrets; never persisted in task payloads or logs.
message SessionCredential { string auth_token = 1; string csrf_token = 2; }
message CheckConnectionRequest { string provider_id = 1; SessionCredential credential = 2; }
message CheckConnectionResponse { string account_id = 1; string username = 2; }
