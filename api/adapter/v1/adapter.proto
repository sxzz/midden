syntax = "proto3";

package adapter.v1;

option go_package = "monitor/api/adapter/v1;adapterv1";

service Adapter {
  // Describe is required; all other operations are opt-in per provider.
  rpc Describe(DescribeRequest) returns (DescribeResponse);
  rpc Resolve(ResolveRequest) returns (ResolveResponse);
  rpc PrepareCredential(PrepareCredentialRequest) returns (PrepareCredentialResponse);
  rpc Fetch(FetchRequest) returns (FetchResponse);
  rpc CheckConnection(CheckConnectionRequest) returns (CheckConnectionResponse);
  // capture.access/1: verify an account can still read stored content without a full fetch.
  rpc CheckAccess(CheckAccessRequest) returns (CheckAccessResponse);
}

message DescribeRequest {}

enum Visibility {
  VISIBILITY_UNSPECIFIED = 0;
  VISIBILITY_PUBLIC = 1;
  VISIBILITY_PRIVATE = 2;
}

// Names are extensible. Unknown names/major versions are ignored by callers.
message Capability {
  string name = 1;
  uint32 major = 2;
  uint32 minor = 3;
}

message Provider {
  string id = 1;
  string authentication = 2;
  repeated Visibility visibilities = 3;
  repeated Capability capabilities = 4;
  repeated string entity_types = 5;
  bool default_provider = 6; // Default within this authentication mode.
  string credential_help = 7; // Adapter-owned input instructions.

}

message DescribeResponse {
  // Strict major.minor. Minor revisions must remain backward compatible.
  string protocol_version = 1;
  string adapter_id = 2;
  string version = 3;
  repeated string hosts = 4;
  repeated Provider providers = 5;
  repeated EntityType entity_types = 6;
  string display_name = 7; // Adapter-owned user-facing name; empty means use adapter_id.
}

message FetchRequest {
  string url = 1;
  string external_id = 2;
  string provider_id = 3;
  string connection_id = 4;
  string access_scope = 5;
  string request_id = 6;
  Credential credential = 7;
  string platform = 8;
  string kind = 9;
  string object_scope = 10;
  uint32 page_size = 13; // Optional target size; adapter may exceed it to preserve whole upstream pages.
  string page_cursor = 12; // Opaque capture.page/1 continuation, same provider and connection.
  bool automatic = 11; // Related captures must not recursively expand collections.
}

message Resource {
  string url = 1;
  string kind = 2;
  // Immutable media identity including rendition, scoped by platform/provider/access.
  string immutable_key = 3;
  string alt_text = 4;
  bool sensitive = 5;
  string purpose = 6; // Adapter-defined role. Empty resources appear in the generic presentation.
}

// Adapter-owned JSON Schema (2020-12), bundled and self-contained.
message EntityType {
  string name = 1;
  bytes json_schema = 2;
}
message Entity {
  string key = 1; // Local graph key, not a database ID.
  string type = 2;
  string external_id = 3;
  bytes data_json = 4;
  repeated uint32 resource_indices = 5; // Indices in FetchResponse.resources.
  // Non-root context: snapshot and entity-version it, but exclude its data/media
  // and generic author_name/summary from collection revision comparison.
  bool context_only = 6;
}
message EntityRelation {
  string source = 1;
  string target = 2;
  string type = 3;
}
message EntityGraph {
  string root = 1;
  repeated Entity entities = 2;
  repeated EntityRelation relations = 3;
}
message SourceResponse {
  bytes body = 1; // Original response body, before JSON parsing or normalization.
  string content_type = 2;
  string source_url = 3; // No credentials or request headers.
  Visibility visibility = 4; // Account responses stay private even for public posts.
}
message RelatedTarget {
  string url = 1;
  uint32 refresh_after_seconds = 2; // Zero reuses any existing collection; positive refreshes stale data.
  string updated_at = 3; // Latest known content change (publication or edit) in RFC 3339; empty when unknown.
}

message FetchResponse {
  string external_id = 1;
  string text = 2; // Optional generic presentation; channels do not parse entity JSON.
  string text_kind = 3;
  repeated Resource resources = 4;
  repeated string warnings = 5;
  string provider_id = 6;
  string adapter_version = 7;
  string text_source = 8;
  bool incomplete = 9;
  Visibility visibility = 10;
  EntityGraph graph = 11;
  repeated SourceResponse source_responses = 12;
  string summary = 13; // Adapter-provided list presentation; channels may truncate it.
  string author_name = 14; // Generic presentation, supplied by the adapter.
  ResolveResponse canonical_target = 16; // Optional stable identity, same platform and kind.
  repeated RelatedTarget related_targets = 17; // capture.related/1; one level, same provider/connection.
  uint32 max_batch_size = 19; // Optional collection batch limit; zero disables batch actions.
  string next_page_cursor = 18; // Empty at end of collection; capture.page/1.
  string published_at = 15; // Original publication time in RFC 3339; empty when unknown.
  repeated ObjectRef restricted_targets = 20; // Embedded (non-root) objects in the graph lacking public evidence.
}

// Execution-only secrets; never persisted in task payloads or logs.
message Credential { bytes data = 1; } // Opaque to the core; adapter-owned format.
message ResolveRequest { string url = 1; }
message ResolveResponse {
  string url = 1;
  string platform = 2;
  string kind = 3;
  string object_scope = 4;
  string external_id = 5;
  bool collection = 7; // Explicit capture expands a collection of related targets.
  bool refresh_on_submit = 6; // Explicit submissions always observe this target again.
}
message PrepareCredentialRequest { string provider_id = 1; bytes input = 2; }
message PrepareCredentialResponse { Credential credential = 1; }

message CheckConnectionRequest { string provider_id = 1; Credential credential = 2; }
message CheckConnectionResponse { string account_id = 1; string username = 2; }

message ObjectRef {
  string platform = 1;
  string kind = 2;
  string object_scope = 3;
  string external_id = 4;
}
// Errors follow Fetch: PERMISSION_DENIED/NOT_FOUND mean no access, UNAUTHENTICATED
// requires authorization again, RESOURCE_EXHAUSTED/UNAVAILABLE may carry retry-after.
message CheckAccessRequest {
  string url = 1;
  ObjectRef target = 2;
  repeated ObjectRef embedded = 3; // Other restricted objects the stored revision contains; report which are visible.
  string provider_id = 4;
  string connection_id = 5;
  string access_scope = 6;
  string request_id = 7;
  Credential credential = 8;
}
message CheckAccessResponse {
  Visibility visibility = 1; // Of the target, same semantics as FetchResponse.visibility.
  repeated ObjectRef accessible = 2; // Subset of {target} and embedded the account can read.
}
