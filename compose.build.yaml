# Optional local development builds. Production pulls published images.
services:
  core:
    image: midden-core:dev
    build:
      context: .
      args:
        VCS_REF: ${MIDDEN_BUILD_REVISION:-}
  migrate:
    image: midden-core:dev
    build:
      context: .
      args:
        VCS_REF: ${MIDDEN_BUILD_REVISION:-}
  tls-init:
    image: midden-core:dev
    build:
      context: .
      args:
        VCS_REF: ${MIDDEN_BUILD_REVISION:-}
  adapter:
    image: midden-adapter:dev
    build:
      context: .
      dockerfile: adapters/x/Dockerfile
