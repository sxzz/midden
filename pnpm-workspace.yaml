ignoreWorkspaceRootCheck: true
minimumReleaseAge: 0
minimumReleaseAgeExcludePrune: true
trustLockfile: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 10080 # 7 days
trustPolicyExcludePrune: true
# tsrs publishes each platform binary with its own trusted publisher.
trustPolicyExclude:
  - tsrs
  - '@tsrs/*'
shellEmulator: true
packages:
  - server
  - shared
  - tools/*
  - third_party/atmosphere
  - web

allowBuilds:
  esbuild: false
  workerd: false
