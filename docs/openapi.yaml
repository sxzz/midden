openapi: 3.0.3
info:
  title: Monitor Collection API
  version: 0.1.0
  description: Tenant-scoped collections. Telegram Mini App sessions browse saved content only; Bearer clients retain existing public-content access.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
  - webSession: []
paths:
  /v1/auth/telegram:
    post:
      summary: Exchange signed Telegram initData for a 12-hour HttpOnly session
      description: Requires configured web_app_url, matching Origin, valid bot signature and auth_date within five minutes (30 seconds future tolerance). Resolves the same tenant as the Bot.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [init_data]
              properties:
                init_data: { type: string }
      responses:
        "200":
          description: Session created; sets __Host-midden cookie (Secure, HttpOnly, SameSite=None, Path=/)
          content:
            application/json:
              schema:
                {
                  type: object,
                  properties: { tenant_id: { type: string, format: uuid } },
                }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Origin does not match web_app_url }
        "404": { description: Mini App disabled }
  /v1/session:
    get:
      summary: Read the authenticated tenant
      responses:
        "200":
          description: Current identity
          content:
            application/json:
              schema:
                {
                  type: object,
                  properties: { tenant_id: { type: string, format: uuid } },
                }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      summary: Revoke the current browser session and clear its cookie
      responses:
        "204": { description: Session revoked }
        "403": { description: Invalid Origin for a cookie-authenticated write }
  /v1/collections/{id}/availability:
    get:
      summary: Read capture availability for this saved collection's adapter
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: Background discovery status (may lag by 15 seconds plus discovery time)
          content:
            application/json:
              schema:
                { type: object, properties: { available: { type: boolean } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/collections/{id}/revisions:
    get:
      summary: List retained versions across saved source scopes of the same collection identity, newest first
      parameters:
        - { $ref: "#/components/parameters/ID" }
        - { in: query, name: cursor, schema: { type: string } }
      responses:
        "200":
          description: At most 20 versions; next_cursor is omitted at the end
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        created_at: { type: string, format: date-time }
                  next_cursor: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/collections/{id}/revisions/{revision_id}:
    get:
      summary: Read one retained version with its original entity and media snapshots
      parameters:
        - { $ref: "#/components/parameters/ID" }
        - {
            in: path,
            name: revision_id,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "200":
          description: Saved collection version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Collection" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/captures:
    post:
      summary: Submit an X URL or refresh an existing collection
      parameters:
        - in: header
          name: Idempotency-Key
          schema: { type: string, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                url: { type: string, format: uri }
                refresh_id: { type: string, format: uuid }
                provider_id:
                  {
                    type: string,
                    enum: [fxtwitter, x-session],
                    description: Inferred from connection_id when omitted.,
                  }
                connection_id:
                  {
                    type: string,
                    format: uuid,
                    description: Optional tenant-owned ready X session connection; omitted means public FxTwitter API.,
                  }
                update_mode: { $ref: "#/components/schemas/UpdateMode" }
              description: Supply url for a new capture or refresh_id to re-fetch with the tenant save record's original provider and connection.
      responses:
        "202":
          description: Capture accepted or existing capture reused
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Idempotency conflict or storage quota exceeded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Account authentication or provider unsupported
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Tenant capture rate exceeded; Retry-After is returned
  /v1/refresh-batches:
    post:
      summary: Refresh many saved collections in the background
      description: >-
        Each collection is submitted in order as if by POST /v1/captures with
        refresh_id. The tenant capture rate delays the batch instead of failing
        it; collections deleted meanwhile are counted as rejected. A batch
        started from a web session reports its progress in one Telegram private
        message, edited until it finishes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [collection_ids]
              properties:
                collection_ids:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { type: string, format: uuid }
                  description: Collections this tenant saved; duplicates are merged.
                update_mode: { $ref: "#/components/schemas/UpdateMode" }
      responses:
        "202":
          description: Batch accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RefreshBatch" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: Empty or oversized batch, or unknown update mode
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/refresh-batches/{id}:
    get:
      summary: Read refresh batch progress
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: Refresh batch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RefreshBatch" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/jobs/{id}:
    get:
      summary: Read capture status
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: Capture
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/collections/authors:
    get:
      summary: List the authors of this tenant's saved collections
      description: >-
        An author is the entity an adapter graph points at with an authored_by
        relation from its root. Its id is the stable identity of that entity —
        platform, declared entity type and adapter external id, each percent
        escaped and joined with "/" — so a renamed account keeps one id and two
        accounts sharing a display name keep separate ids. The name is the most
        recent display name captured for that identity and is presentation only.
      responses:
        "200":
          description: Unique author identities ordered by display name
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, name]
                      properties:
                        id: { type: string }
                        name: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/collections:
    get:
      summary: List this tenant's collection, newest first
      description: Cookie sessions always use filtered collection pagination. Bearer requests with no filter parameters retain legacy cursor semantics. Filtered cursors are bound to the filter values and include their own sorting anchor. Saved source scopes with the same platform, kind, object scope and external ID appear once, using the latest captured snapshot. Storage includes all of this tenant's saved source scopes.
      parameters:
        - in: query
          name: related_to
          schema: { type: string, format: uuid }
          description: Saved collection whose graph identity is related to the returned collections. Matches either direction across this tenant's saved source scopes and excludes the requested collection.
        - in: query
          name: entity_type
          schema: { type: string }
          description: Adapter-declared root entity type, for example x.post or x.profile.
        - in: query
          name: author
          style: form
          explode: true
          schema:
            type: array
            maxItems: 100
            items: { type: string }
          description: Stable author ids from /v1/collections/authors, in their canonical encoding. Repeated parameters match any selected author. Display names are never accepted.
        - in: query
          name: sensitive
          schema: { type: string, enum: [contains, not_contains] }
          description: Whether the current revision has any sensitive content resource. Avatars and other non-content purposes are ignored; not_contains also matches collections with no resources. Omitted means no restriction.
        - {
            in: query,
            name: q,
            schema: { type: string, maxLength: 500 },
            description: Literal case-insensitive substring in current text,
            summary or author name.,
          }
        - {
            in: query,
            name: media_type,
            schema:
              {
                type: string,
                pattern: "^(image|video|text)(,(image|video|text))*$",
              },
            description: Comma-separated media types matched with OR. Avatar resources are excluded.,
          }
        - {
            in: query,
            name: visibility,
            schema: { type: string, enum: [public, private] },
          }
        - {
            in: query,
            name: saved_from,
            schema: { type: string, format: date-time },
            description: Inclusive saved time.,
          }
        - {
            in: query,
            name: saved_before,
            schema: { type: string, format: date-time },
            description: Exclusive saved time.,
          }
        - in: query
          name: sort
          schema:
            {
              type: string,
              enum: [captured, published, storage],
              default: captured,
            }
          description: Order by capture time, publication time or total collection storage bytes.
        - in: query
          name: order
          schema: { type: string, enum: [asc, desc], default: desc }
        - in: query
          name: cursor
          schema: { type: string }
          description: Opaque cursor bound to the filters and ordering. Filtered pages contain at most 20 collections; legacy pages at most 10.
      responses:
        "200":
          description: Page
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    {
                      type: array,
                      items: { $ref: "#/components/schemas/Collection" },
                    }
                  next_cursor: { type: string }
                  total_storage_bytes:
                    type: integer
                    format: int64
                    description: Present with related_to. Sum of related collection storage across all pages and saved source scopes, restricted by entity_type; other display filters do not change this total. Shared blobs are deduplicated within each source collection.
                  previous_cursor: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/collections/{id}:
    delete:
      summary: Remove this tenant's collection reference and release its logical usage
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "204":
          {
            description: Collection reference removed; other tenants are unaffected,
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    get:
      summary: Read the current retained revision
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: Collection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Collection" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/entities/{id}:
    get:
      summary: Read the latest entity version linked to your saved collections
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: Entity snapshot including adapter schema and resources
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Entity" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/collections/{id}/sources:
    get:
      summary: List up to 100 latest retained upstream responses visible to this tenant
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: Raw response descriptors; personal account responses are owner-only
          content:
            application/json:
              schema:
                {
                  type: array,
                  items: { $ref: "#/components/schemas/SourceResponse" },
                }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/sources/{id}:
    get:
      summary: Download the original upstream JSON response body without reserialization
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: Original UTF-8 response bytes, private/no-store
          content:
            application/json:
              schema: {}
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/assets/{id}:
    head:
      summary: Read authorized media headers without a body
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { description: Media headers including size and Accept-Ranges }
        "404": { $ref: "#/components/responses/NotFound" }
    get:
      summary: Download or preview authorized saved original media
      parameters:
        - { $ref: "#/components/parameters/ID" }
        - {
            in: query,
            name: inline,
            schema: { type: string, enum: ["1"] },
            description: Inline display for supported image and video MIME types.,
          }
        - {
            in: header,
            name: Range,
            schema: { type: string },
            description: Single byte range only.,
          }
      responses:
        "200":
          description: Original bytes; private/no-store; attachment disposition
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "206": { description: Partial media bytes with Content-Range }
        "416": { description: Invalid or multiple ranges }
        "503": { description: Object store unavailable }
  /v1/usage:
    get:
      summary: Shared tenant storage use across all channel identities
      responses:
        "200":
          description: Usage in bytes, excluding DB indexes, queue, backups and logs
          content:
            application/json:
              schema:
                type: object
                required: [used_bytes, reserved_bytes, limit_bytes, unlimited]
                properties:
                  used_bytes: { type: integer, format: int64 }
                  reserved_bytes: { type: integer, format: int64 }
                  limit_bytes:
                    {
                      type: integer,
                      format: int64,
                      description: "Configured quota; not enforced when unlimited is true",
                    }
                  unlimited: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
components:
  securitySchemes:
    webSession:
      {
        type: apiKey,
        in: cookie,
        name: __Host-midden,
        description: Cookie write requests require matching Origin. Explicit invalid Bearer credentials never fall back to a cookie.,
      }
    bearerAuth: { type: http, scheme: bearer }
  parameters:
    ID:
      {
        in: path,
        name: id,
        required: true,
        schema: { type: string, format: uuid },
      }
  responses:
    Unauthorized:
      description: Missing, invalid or revoked tenant token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource absent or not visible to tenant
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    UpdateMode:
      type: string
      enum: [full, append]
      default: full
      description: >-
        full captures the content again. append reuses content whose newest
        version came from a complete capture and that has not changed upstream
        since it was last observed, judged by the adapter-reported update time
        (publication or edit) of collection members. A collection such as a
        profile is always fetched again to list its members; only its members
        are reused.
    RefreshBatch:
      type: object
      properties:
        id: { type: string, format: uuid }
        state:
          {
            type: string,
            enum: [running, complete, failed],
            description: complete once every collection was submitted; captures may still be running.,
          }
        error: { type: string }
        update_mode: { $ref: "#/components/schemas/UpdateMode" }
        total: { type: integer }
        submitted: { type: integer }
        reused:
          {
            type: integer,
            description: Submissions answered by existing content without fetching.,
          }
        rejected:
          {
            type: integer,
            description: Collections that could not be submitted,
            such as deleted ones.,
          }
        running:
          {
            type: integer,
            description: Captures started by this batch that are still queued or downloading. Collection members are counted in members.,
          }
        complete: { type: integer }
        partial: { type: integer }
        failed: { type: integer }
        members:
          type: object
          description: Captures that selected collections (such as profiles) started for their members, which finish after the collections themselves.
          properties:
            total: { type: integer }
            complete: { type: integer }
            partial: { type: integer }
            failed: { type: integer }
            pending: { type: integer }
            done: { type: boolean }
        done:
          {
            type: boolean,
            description: Every submission and every member capture has finished.,
          }
    Job:
      type: object
      properties:
        id: { type: string, format: uuid }
        collection_id:
          {
            type: string,
            format: uuid,
            description: Provisional while queued; read the completed job for the final shared collection ID.,
          }
        state:
          {
            type: string,
            enum: [queued, downloading, complete, partial, failed],
          }
        error: { type: string }
        provider_id: { type: string }
        connection_id: { type: string, format: uuid }
        access_scope: { type: string }
        created_at: { type: string, format: date-time }
        members:
          type: object
          description: >-
            Only on collection captures (such as profiles), from GET
            /v1/jobs/{id}. The collection's own capture ends once its members
            are listed; their captures finish later. done is true once every
            member capture of this tenant's newest submission has finished.
          properties:
            total: { type: integer }
            complete: { type: integer }
            partial: { type: integer }
            failed: { type: integer }
            pending: { type: integer }
            done: { type: boolean }
    Asset:
      type: object
      properties:
        purpose:
          {
            type: string,
            description: Adapter-defined role; empty means presentation media,
          }
        id: { type: string, format: uuid }
        position: { type: integer }
        state: { type: string, enum: [pending, ready, failed] }
        error: { type: string }
        sha256: { type: string }
        mime: { type: string }
        size: { type: integer, format: int64 }
    Entity:
      type: object
      properties:
        id: { type: string, format: uuid }
        version_id: { type: string, format: uuid }
        saved_collection_id:
          type: string
          format: uuid
          description: Current tenant's saved collection for this entity, resolved at read time.
        key: { type: string }
        type: { type: string, description: Adapter-defined entity type }
        external_id: { type: string }
        data: { description: Adapter-defined JSON value }
        schema:
          {
            type: object,
            description: JSON Schema snapshot used to validate this version,
          }
        resource_indices: { type: array, items: { type: integer, minimum: 0 } }
        assets: { type: array, items: { $ref: "#/components/schemas/Asset" } }
    IncomingRelation:
      type: object
      required: [type, entity]
      properties:
        type: { type: string, enum: [reposted, quoted] }
        entity: { $ref: "#/components/schemas/Entity" }
        author:
          allOf: [{ $ref: "#/components/schemas/Entity" }]
          description: Optional author connected by authored_by in the selected source snapshot. Saved profile links are restricted to the current tenant.
    EntityGraph:
      type: object
      properties:
        root: { type: string }
        entities:
          { type: array, items: { $ref: "#/components/schemas/Entity" } }
        relations:
          type: array
          items:
            type: object
            properties:
              source: { type: string }
              target: { type: string }
              type: { type: string }
    SourceResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        capture_id: { type: string, format: uuid }
        provider_id: { type: string }
        adapter_version: { type: string }
        visibility: { type: string, enum: [public, private] }
        content_type: { type: string }
        source_url: { type: string, format: uri }
        sha256: { type: string }
        size: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
    Collection:
      type: object
      properties:
        incoming_relations:
          type: array
          items: { $ref: "#/components/schemas/IncomingRelation" }
          description: Detail-only view of incoming reposted and quoted relations retained in the current tenant's saved history. Sources are deduplicated by stable entity identity and relation type, using their latest saved entity data. Does not modify the captured graph.
        relation_types:
          type: array
          items: { type: string }
          description: Adapter graph relation kinds connecting this collection to related_to, including relations retained in older profile timeline snapshots.
        storage_bytes:
          type: integer
          format: int64
          description: Saved collection storage including all revisions, deduplicated media and source responses. Shared media is counted in each collection.
        saved_at:
          {
            type: string,
            format: date-time,
            description: Included in filtered collection results.,
          }
        id: { type: string, format: uuid }
        url: { type: string, format: uri }
        external_id: { type: string }
        provider_id: { type: string }
        access_scope: { type: string }
        revision_id: { type: string, format: uuid }
        visibility:
          {
            type: string,
            enum: [public, private],
            description: Visibility declared by the provider,
          }
        text: { type: string }
        summary:
          { type: string, description: Adapter-provided collection summary }
        author_name: { type: string }
        published_at: { type: string, format: date-time }
        text_kind: { type: string, enum: [provider_summary, post_text] }
        graph: { $ref: "#/components/schemas/EntityGraph" }
        text_source: { type: string, description: Source of the saved text }
        adapter_version: { type: string }
        warnings: { type: array, items: { type: string } }
        assets: { type: array, items: { $ref: "#/components/schemas/Asset" } }
        observed_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
