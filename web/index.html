<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#efeff4" />
    <script>
      // Before the first paint, so a dark page never flashes light: the
      // theme chosen in this browser (theme.ts, as useDark stores it), else
      // the system's. Telegram's own theme is applied over it (host.ts).
      try {
        var chosen = localStorage.getItem('midden.theme')
        var dark =
          chosen === 'dark' ||
          (chosen !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) {
          document.documentElement.classList.add('dark')
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', '#121212')
        }
      } catch (error) {}
    </script>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Added to a desktop or home screen (composables/useInstall.ts), the
         app opens in a window of its own, its bar coloured by theme-color
         above. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Midden" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Midden · 收藏</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
